<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна 6 — Завдання 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene">
        <div class="card"></div>
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        <div class="arrows">
            <span class="arrow">&larr;</span>
            <span class="arrow arrow-right">&rarr;</span>
        </div>
        <div class="temperature">17</div>
        <div class="forecast">
            <div class="day"><span class="day-name">Mon</span><span class="day-temp">17°</span></div>
            <div class="day"><span class="day-name">Tue</span><span class="day-temp">19°</span></div>
            <div class="day"><span class="day-name">Wed</span><span class="day-temp">16°</span></div>
            <div class="day"><span class="day-name">Thu</span><span class="day-temp">18°</span></div>
            <div class="day"><span class="day-name">Fri</span><span class="day-temp">21°</span></div>
        </div>
        <div class="hidden-note">Прихований елемент</div>
    </div>
</body>
</html>
