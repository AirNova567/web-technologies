<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна 6 — Завдання 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a class="header-link" href="#">Mail</a>
        <a class="header-link" href="#">Images</a>
        <div class="popup-wrapper">
            <input class="toggle popup-toggle" type="checkbox" id="popup-toggle">
            <label class="popup-button" for="popup-toggle"><img class="popup-button-icon" src="icons/popup-button.png" alt="Apps"></label>
            <div class="popup">
                <div class="popup-body" tabindex="0">
                    <div class="popup-grid">
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/calendar.png" alt=""><span class="popup-name">Calendar</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/mail.png" alt=""><span class="popup-name">Mail</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/news.png" alt=""><span class="popup-name">News</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/maps.png" alt=""><span class="popup-name">Map</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/files.png" alt=""><span class="popup-name">Files</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/contacts.png" alt=""><span class="popup-name">Contacts</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/tanslation.png" alt=""><span class="popup-name">Translate</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/videos.png" alt=""><span class="popup-name">Videos</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/search.png" alt=""><span class="popup-name">Search</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/photos.png" alt=""><span class="popup-name">Photo</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/apps.png" alt=""><span class="popup-name">Apps</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/documents.png" alt=""><span class="popup-name">Document</span></a>
                    </div>
                    <div class="popup-extra">
                        <div class="popup-grid">
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/chat.png" alt=""><span class="popup-name">Chat</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/classroom.png" alt=""><span class="popup-name">Classroom</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/collection.png" alt=""><span class="popup-name">Collection</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/mars.png" alt=""><span class="popup-name">Mars</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/blogs.png" alt=""><span class="popup-name">Blogs</span></a>
                    <a class="popup-app" href="#"><img class="popup-icon" src="icons/promo.png" alt=""><span class="popup-name">Promos</span></a>
                        </div>
                        <a class="popup-footer-link" href="#">Even more from Kottans</a>
                    </div>
                </div>
                <input class="toggle more-toggle" type="checkbox" id="more-toggle">
                <label class="popup-more" for="more-toggle">More</label>
            </div>
        </div>
        <a class="header-link" href="#"><img class="header-icon" src="icons/bell.png" alt="Notifications"></a>
        <a class="header-link" href="#"><img class="header-avatar" src="icons/favicon.png" alt="Profile"></a>
    </header>
</body>
</html>
