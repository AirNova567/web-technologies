<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Завдання 1: Таблиця</title>
</head>
<body>
  <header align="center">
    <h1>Індивідуальне завдання №1</h1>
  </header>

  <main align="center">
    <table border="2" bordercolor="#000000" cellspacing="0" cellpadding="0" width="400" height="400" align="center">
      <tr height="40">
        <td colspan="8" bgcolor="#2ef6cd">&nbsp;</td>
      </tr>

      <tr height="40">
        <td rowspan="6" bgcolor="#ffffd5" width="40">&nbsp;</td>
        <td colspan="6" bgcolor="#2ef6cd">&nbsp;</td>
        <td rowspan="6" bgcolor="#ffffd5" width="40">&nbsp;</td>
      </tr>

      <tr height="40">
        <td rowspan="4" bgcolor="#ffffd5" width="40">&nbsp;</td>
        <td colspan="4" bgcolor="#2ef6cd">&nbsp;</td>
        <td rowspan="4" bgcolor="#ffffd5" width="40">&nbsp;</td>
      </tr>

      <tr height="60">
        <td rowspan="2" bgcolor="#ffffd5" width="40">&nbsp;</td>
        <td bgcolor="#ff0000" width="60">&nbsp;</td>
        <td bgcolor="#0000ff" width="60">&nbsp;</td>
        <td rowspan="2" bgcolor="#ffffd5" width="40">&nbsp;</td>
      </tr>

      <tr height="60">
        <td bgcolor="#00ff00">&nbsp;</td>
        <td bgcolor="#ffff00">&nbsp;</td>
      </tr>

      <tr height="40">
        <td colspan="4" bgcolor="#2ef6cd">&nbsp;</td>
      </tr>

      <tr height="40">
        <td colspan="6" bgcolor="#2ef6cd">&nbsp;</td>
      </tr>

      <tr height="40">
        <td colspan="8" bgcolor="#2ef6cd">&nbsp;</td>
      </tr>
    </table>

    <p align="center">
      <font size="3">
        <a href="../index.html">Повернутись на головну</a>
      </font>
    </p>
  </main>

  <footer></footer>
</body>
</html>
